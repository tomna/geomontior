<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <link rel="manifest" href="/manifest.json" />
  <title>GeoMonitor v5 · Clima, Sismos y Alertas 24/7</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: #070b12; color: #e5e7eb; overflow: hidden; }
    #map { position: absolute; inset: 0; }
    .panel { position: absolute; background: rgba(10,15,24,0.94); border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(12px); z-index: 10; font-size: 13px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); overflow: hidden; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: rgba(255,255,255,0.04); border-bottom: 1px solid rgba(255,255,255,0.06); font-weight: 600; color: #fff; }
    .panel-toggle { background: none; border: none; color: #9ca3af; font-size: 18px; cursor: pointer; width: 24px; height: 24px; border-radius: 6px; }
    .panel-body { padding: 12px 14px; max-height: 65vh; overflow-y: auto; }
    .panel-body.collapsed { display: none; }
    #layer-panel { top: 12px; right: 12px; width: 270px; }
    #ai-panel { top: 12px; left: 12px; width: 240px; }
    #legend-panel { bottom: 20px; left: 12px; width: 250px; }
    .layer-item { display: flex; align-items: center; margin: 6px 0; cursor: pointer; }
    .layer-item input { margin-right: 10px; accent-color: #3b82f6; }
    .section-title { font-weight: 600; color: #fff; margin: 10px 0 4px; font-size: 11px; text-transform: uppercase; }
    .section-title:first-child { margin-top: 0; }
    .legend-row { display: flex; align-items: center; margin: 4px 0; font-size: 12px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; border: 1px solid rgba(255,255,255,0.3); }
    .maplibregl-popup-content { background: #0f1724 !important; color: #fff !important; border-radius: 10px !important; padding: 14px 16px !important; border: 1px solid rgba(255,255,255,0.12) !important; max-width: 340px !important; }
    .maplibregl-popup-tip { border-top-color: #0f1724 !important; }
    #search-box { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 20; background: rgba(10,15,24,0.94); border-radius: 10px; padding: 6px 12px; display: flex; gap: 8px; align-items: center; border: 1px solid rgba(255,255,255,0.1); }
    #search-box input { background: transparent; border: none; color: #fff; font-size: 14px; width: 260px; outline: none; }
    #search-box button { background: #2563eb; border: none; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    .ai-item { padding: 6px 8px; border-left: 3px solid #f97316; background: rgba(249,115,22,0.08); border-radius: 4px; margin: 6px 0; font-size: 12px; }
    .ai-item strong { color: #fb923c; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-right: 6px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .badge { font-size: 9px; padding: 1px 6px; border-radius: 8px; background: #2563eb; color: #fff; margin-left: auto; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Buscador de lugares -->
  <div id="search-box">
    <input id="search-input" placeholder="Buscar ciudad o lugar..." />
    <button id="search-btn">🔍</button>
  </div>

  <!-- Panel de capas -->
  <div class="panel" id="layer-panel">
    <div class="panel-header"><span>🗂️ Capas</span><button class="panel-toggle" data-target="layer-panel-body">−</button></div>
    <div class="panel-body" id="layer-panel-body">
      <div class="section-title">Meteorología</div>
      <label class="layer-item"><input type="checkbox" id="layer-weather" checked> Condiciones extremas</label>
      <label class="layer-item"><input type="checkbox" id="layer-radar" checked> Radar de lluvia</label>
      <label class="layer-item"><input type="checkbox" id="layer-noaa"> Alertas NOAA (EE.UU.)</label>
      <div class="section-title">Geología</div>
      <label class="layer-item"><input type="checkbox" id="layer-quakes" checked> Terremotos (M≥2.5)</label>
      <label class="layer-item"><input type="checkbox" id="layer-tsunami"> Tsunamis</label>
      <div class="section-title">Otros eventos</div>
      <label class="layer-item"><input type="checkbox" id="layer-cyclones"> Ciclones tropicales</label>
      <label class="layer-item"><input type="checkbox" id="layer-fires"> Incendios activos (NASA)</label>
      <hr style="border-color:rgba(255,255,255,0.08); margin:8px 0;">
      <div style="font-size:11px; color:#9ca3af;">Filtro de magnitud mínima:</div>
      <input type="range" id="mag-filter" min="2.5" max="7" step="0.5" value="2.5" style="width:100%;">
      <div id="mag-label" style="font-size:11px; color:#60a5fa;">M ≥ 2.5</div>
      <div style="font-size:11px; color:#9ca3af; margin-top:6px;">Opacidad del radar:</div>
      <input type="range" id="radar-opacity" min="0" max="100" value="50" style="width:100%;">
      <div style="font-size:11px; color:#9ca3af; margin-top:6px;">NASA FIRMS MAP_KEY:</div>
      <input type="text" id="firms-key" placeholder="Opcional" style="width:100%; padding:4px; border-radius:4px; border:1px solid #333; background:#1a1f2e; color:#fff; font-size:11px;">
    </div>
  </div>

  <!-- Panel de IA / TFT -->
  <div class="panel" id="ai-panel">
    <div class="panel-header"><span>🧠 Predicción TFT</span><button class="panel-toggle" data-target="ai-panel-body">−</button></div>
    <div class="panel-body" id="ai-panel-body">
      <div id="ai-output"><div class="status-dot"></div>Consultando modelo...</div>
    </div>
  </div>

  <!-- Leyenda -->
  <div class="panel" id="legend-panel">
    <div class="panel-header"><span>📊 Leyenda</span><button class="panel-toggle" data-target="legend-panel-body">−</button></div>
    <div class="panel-body" id="legend-panel-body">
      <div class="section-title">Sismos</div>
      <div class="legend-row"><span class="legend-dot" style="background:#ff3b30;"></span> M ≥ 4.5</div>
      <div class="legend-row"><span class="legend-dot" style="background:#ff9500;"></span> M 3.0 – 4.4</div>
      <div class="legend-row"><span class="legend-dot" style="background:#ffcc00;"></span> M 2.5 – 2.9</div>
      <div class="section-title">Clima extremo</div>
      <div class="legend-row"><span class="legend-dot" style="background:#ef4444;"></span> Tormenta eléctrica</div>
      <div class="legend-row"><span class="legend-dot" style="background:#f97316;"></span> Viento fuerte</div>
      <div class="legend-row"><span class="legend-dot" style="background:#22d3ee;"></span> Granizo</div>
      <div class="legend-row"><span class="legend-dot" style="background:#3b82f6;"></span> Lluvia intensa</div>
    </div>
  </div>

  <script>
    const BACKEND = ''; // Cambia si despliegas el backend

    // ========== 1. MAPA ==========
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [-3.7038, 40.4168], zoom: 3, maxZoom: 18
    });

    // Forzar etiquetas en español (OpenFreeMap Liberty soporta multilingüe)
    map.once('styledata', () => { map.setMapLanguage('es'); });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-left');
    map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-right');
    map.addControl(new maplibregl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true }, trackUserLocation: true, showAccuracyCircle: true
    }), 'top-left');

    // ========== 2. SERVICE WORKER + PUSH ==========
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(async (reg) => {
        const sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array('TU_CLAVE_PUBLICA_VAPID_AQUI')
        });
        await fetch(`${BACKEND}/api/subscribe`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(sub)
        });
      }).catch(console.warn);
    }
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const raw = atob(base64); return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
    }

    // ========== 3. CAPA DE TERREMOTOS (desde backend) ==========
    let quakeData = null;
    async function loadQuakes() {
      try {
        const res = await fetch(`${BACKEND}/api/quakes`);
        quakeData = await res.json();
        if (!map.getSource('quakes')) {
          map.addSource('quakes', { type: 'geojson', data: quakeData, cluster: true, clusterMaxZoom: 14, clusterRadius: 50 });
          map.addLayer({ id: 'clusters', type: 'circle', source: 'quakes', filter: ['has', 'point_count'], paint: { 'circle-color': ['step', ['get', 'point_count'], '#ffcc00', 10, '#ff9500', 50, '#ff3b30'], 'circle-radius': ['step', ['get', 'point_count'], 15, 10, 20, 50, 25], 'circle-stroke-width': 2, 'circle-stroke-color': '#fff' } });
          map.addLayer({ id: 'cluster-count', type: 'symbol', source: 'quakes', filter: ['has', 'point_count'], layout: { 'text-field': '{point_count_abbreviated}', 'text-size': 12 } });
          map.addLayer({ id: 'quakes-circles', type: 'circle', source: 'quakes', filter: ['!', ['has', 'point_count']], paint: { 'circle-radius': ['interpolate', ['linear'], ['get', 'mag'], 2.5, 5, 6, 14], 'circle-color': ['step', ['get', 'mag'], '#ffcc00', 3.0, '#ff9500', 4.5, '#ff3b30'], 'circle-stroke-width': 1.5, 'circle-stroke-color': '#fff' } });
          map.on('click', 'quakes-circles', (e) => {
            const p = e.features[0].properties;
            new maplibregl.Popup().setLngLat(e.lngLat).setHTML(`<div><strong>M ${p.mag}</strong><br>${p.place}<br>Prof: ${p.depth?.toFixed(1)} km<br>${new Date(p.time).toLocaleString('es-ES')}</div>`).addTo(map);
          });
        } else { map.getSource('quakes').setData(quakeData); }
      } catch (e) { console.warn('Quakes error', e); }
    }

    // ========== 4. CLIMA ==========
    async function loadWeather() {
      try {
        const res = await fetch(`${BACKEND}/api/weather`);
        const geojson = await res.json();
        if (map.getSource('weather-grid')) map.getSource('weather-grid').setData(geojson);
        else {
          map.addSource('weather-grid', { type: 'geojson', data: geojson });
          map.addLayer({ id: 'weather-grid-layer', type: 'circle', source: 'weather-grid', paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 2, 5, 10, 20], 'circle-color': ['get', 'color'], 'circle-opacity': 0.55, 'circle-stroke-width': 1.5, 'circle-stroke-color': '#fff' } });
          map.on('click', 'weather-grid-layer', (e) => {
            const p = e.features[0].properties;
            new maplibregl.Popup().setLngLat(e.lngLat).setHTML(`<div><strong>${p.icon} ${p.type}</strong><br>Temp: ${p.temp}°C · Viento: ${p.wind} km/h</div>`).addTo(map);
          });
        }
      } catch (e) { console.warn('Weather error', e); }
    }

    // ========== 5. RADAR ==========
    let radarTileUrl = null;
    async function loadRadar() {
      try {
        const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
        const json = await res.json();
        radarTileUrl = `https://tilecache.rainviewer.com${json.radar.past.slice(-1)[0].path}/256/{z}/{x}/{y}/2/1_1.png`;
        if (map.getSource('rainviewer')) map.getSource('rainviewer').setTiles([radarTileUrl]);
        else {
          map.addSource('rainviewer', { type: 'raster', tiles: [radarTileUrl], tileSize: 256 });
          map.addLayer({ id: 'rainviewer-layer', type: 'raster', source: 'rainviewer', paint: { 'raster-opacity': 0.5 } }, 'weather-grid-layer');
        }
      } catch (e) { console.warn('Radar error', e); }
    }

    // ========== 6. CICLONES ==========
    async function loadCyclones() {
      try {
        const res = await fetch(`${BACKEND}/api/cyclones`);
        const geojson = await res.json();
        if (map.getSource('cyclones')) map.getSource('cyclones').setData(geojson);
        else {
          map.addSource('cyclones', { type: 'geojson', data: geojson });
          map.addLayer({ id: 'cyclones-layer', type: 'circle', source: 'cyclones', paint: { 'circle-color': '#8b5cf6', 'circle-radius': 14, 'circle-stroke-width': 3, 'circle-stroke-color': '#fff' }, layout: { visibility: 'none' } });
        }
      } catch (e) { console.warn('Cyclones error', e); }
    }

    // ========== 7. TFT (probabilidad real) ==========
    async function loadTFT() {
      try {
        const res = await fetch(`${BACKEND}/api/predict`);
        const d = await res.json();
        document.getElementById('ai-output').innerHTML = `
          <div class="ai-item"><strong>Magnitud esperada:</strong> ${d.magnitud_esperada}</div>
          <div class="ai-item"><strong>Intervalo 80%:</strong> ${d.intervalo_80[0]} – ${d.intervalo_80[1]}</div>
          <div class="ai-item"><strong>Prob. de M≥5.0:</strong> ${d.probabilidad_M5}%</div>
          <div style="font-size:10px; color:#64748b; margin-top:6px;">Modelo TFT · USGS</div>`;
      } catch (e) { document.getElementById('ai-output').innerHTML = '<div style="color:#f87171;">Modelo TFT offline</div>'; }
    }

    // ========== 8. BUSCADOR (Nominatim) ==========
    document.getElementById('search-btn').addEventListener('click', async () => {
      const q = document.getElementById('search-input').value.trim();
      if (!q) return;
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`);
        const data = await res.json();
        if (data.length) map.flyTo({ center: [parseFloat(data[0].lon), parseFloat(data[0].lat)], zoom: 10 });
        else alert('Lugar no encontrado');
      } catch (e) { alert('Error en la búsqueda'); }
    });

    // ========== 9. CONTROLES ==========
    document.getElementById('layer-quakes').addEventListener('change', e => {
      ['quakes-circles', 'clusters', 'cluster-count'].forEach(id => { if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', e.target.checked ? 'visible' : 'none'); });
    });
    document.getElementById('layer-weather').addEventListener('change', e => { if (map.getLayer('weather-grid-layer')) map.setLayoutProperty('weather-grid-layer', 'visibility', e.target.checked ? 'visible' : 'none'); });
    document.getElementById('layer-radar').addEventListener('change', e => { if (map.getLayer('rainviewer-layer')) map.setLayoutProperty('rainviewer-layer', 'visibility', e.target.checked ? 'visible' : 'none'); });
    document.getElementById('layer-cyclones').addEventListener('change', e => { if (e.target.checked) { loadCyclones(); setTimeout(() => { if (map.getLayer('cyclones-layer')) map.setLayoutProperty('cyclones-layer', 'visibility', 'visible'); }, 1000); } else if (map.getLayer('cyclones-layer')) map.setLayoutProperty('cyclones-layer', 'visibility', 'none'); });

    // Filtro de magnitud
    document.getElementById('mag-filter').addEventListener('input', e => {
      const min = parseFloat(e.target.value);
      document.getElementById('mag-label').textContent = `M ≥ ${min.toFixed(1)}`;
      if (quakeData) {
        const filtered = { ...quakeData, features: quakeData.features.filter(f => f.properties.mag >= min) };
        map.getSource('quakes').setData(filtered);
      }
    });

    // Opacidad radar
    document.getElementById('radar-opacity').addEventListener('input', e => {
      if (map.getLayer('rainviewer-layer')) map.setPaintProperty('rainviewer-layer', 'raster-opacity', e.target.value / 100);
    });

    // Minimizar paneles
    document.querySelectorAll('.panel-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const body = document.getElementById(btn.getAttribute('data-target'));
        if (body) { body.classList.toggle('collapsed'); btn.textContent = body.classList.contains('collapsed') ? '+' : '−'; }
      });
    });

    // ========== 10. INICIALIZACIÓN ==========
    map.on('load', () => {
      loadQuakes(); loadWeather(); loadRadar(); loadCyclones(); loadTFT();
      setInterval(loadQuakes, 2 * 60 * 1000);
      setInterval(loadWeather, 10 * 60 * 1000);
      setInterval(loadRadar, 5 * 60 * 1000);
      setInterval(loadTFT, 30 * 60 * 1000);
    });
  </script>
</body>
</html>
